<title>Fushi Family Sushi · Carta / Menu</title>

<style>
:root{--bg:#ffffff;--surface:#f4f6f0;--ink:#2b2b2b;--muted:#5c5c5c;--accent:#b41a2e;--on-accent:#ffffff;--line:#e3e7dc;
--fd:'Ubuntu', system-ui, sans-serif;--fb:'Ubuntu', system-ui, -apple-system, sans-serif;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
img{display:block;max-width:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
/* cabecera */
.hero{position:relative;padding:28px 16px 22px;text-align:center;border-bottom:1px solid var(--line);background:var(--hero-bg,transparent) center/cover}
.hero.has-photo{padding:56px 16px 30px;color:#fff}
.hero.has-photo::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.72))}
.hero>*{position:relative}
.logo{height:84px;width:auto;max-width:70%;object-fit:contain;margin:0 auto 12px}
.hero h1{font:600 clamp(28px,8vw,44px)/1.05 var(--fd);letter-spacing:.01em}
.hero .sub{margin-top:8px;font-size:14px;opacity:.8}
/* barra fija */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 6px 16px -14px rgba(0,0,0,.5)}
.langs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:10px 0 6px}
.langs button{font:600 13px/1 var(--fb);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 10px;border-radius:999px;cursor:pointer;display:flex;gap:6px;align-items:center;min-height:36px}
.langs button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.langs .fl{font-size:16px;line-height:1}
.cats{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:none;max-width:760px;margin:0 auto;scroll-snap-type:x proximity}
.cats::-webkit-scrollbar{display:none}
.cats a{flex:none;scroll-snap-align:start;text-decoration:none;color:var(--muted);font:600 13px/1 var(--fb);padding:9px 13px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.cats a.on{color:var(--ink);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
/* secciones */
section{padding:30px 0 6px;scroll-margin-top:108px}
section h2{font:600 clamp(24px,6.5vw,32px)/1.1 var(--fd);color:var(--ink);display:flex;align-items:center;gap:12px}
section h2::after{content:"";flex:1;height:1px;background:var(--line)}
.snote{margin-top:6px;color:var(--muted);font-size:14px}
.items{list-style:none;margin-top:14px}
.it{padding:14px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:0}
.row{display:flex;align-items:baseline;gap:10px}
.nm{font-weight:600;font-size:17px;line-height:1.3}
.num{font:600 13px/1 var(--fb);color:var(--accent);min-width:24px;font-variant-numeric:tabular-nums}
.dots{flex:1;border-bottom:1px dotted var(--muted);opacity:.45;transform:translateY(-4px);min-width:16px}
.pr{font:600 17px/1 var(--fb);color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.pr small{font-size:12px;color:var(--muted);font-weight:500;margin-left:4px}
.orig{display:block;font-size:13px;color:var(--muted);font-style:italic;margin-top:2px}
.ds{color:var(--muted);font-size:14.5px;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11.5px;font-weight:600;letter-spacing:.02em;padding:3px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.vars{margin-top:6px;font-size:14px;color:var(--muted)}
.vars span{display:inline-block;margin-right:14px}
.vars b{color:var(--accent);font-weight:600}
/* pie */
footer{margin-top:36px;padding:28px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;text-align:center}
footer .nf{font:600 20px/1.2 var(--fd);color:var(--ink);margin-bottom:10px}
footer p{margin:4px 0}
footer a{color:var(--accent);text-decoration:none;font-weight:600}
.legal{margin-top:16px;font-size:12.5px;opacity:.85}
@media (min-width:700px){.nm{font-size:18px}.logo{height:100px}}
</style>
</head>
